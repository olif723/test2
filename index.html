<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Location</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 6px; }
    #status { margin-top: 20px; font-weight: bold; }

    #gate {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
    }

    #gate.hidden { display: none; }

    #gate-background {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(16px) saturate(1.2);
      transform: scale(1.15);
    }

    #gate-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.96);
      padding: 32px;
      margin: 20px;
      max-width: 380px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    #gate-card h2 { margin-top: 0; }
    #gate-card button { margin: 8px 6px 0; }
    #gate-msg { margin-top: 16px; font-weight: bold; min-height: 1.2em; }
    #gate-msg.warning { color: #b30000; }
    #gate-msg.success { color: #0a7a0a; }
  </style>
</head>
<body>

  <h2>Location Sharing</h2>
  <p>Tap the button below to display your GPS location on Google Maps.</p>

  <button id="get-location-btn">Get My Location</button>
  <p id="status"></p>

  <div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <div id="gate-background"></div>
    <div id="gate-card">
      <h2 id="gate-title">Location Permission Required</h2>
      <p>This site needs your location permission to continue.<br>Allow it to reveal the page?</p>
      <button id="gate-accept">Yes, allow</button>
      <button id="gate-decline">No</button>
      <p id="gate-msg" role="alert"></p>
    </div>
  </div>

  <script>
    const NEXT_PAGE_URL = 'page.html';
    const BACKGROUND_IMAGE_URL = 'https://images.unsplash.com/photo-1461749280684-dccba630e2f6';

    const gate = document.getElementById('gate');
    const gateBackground = document.getElementById('gate-background');
    const gateMsg = document.getElementById('gate-msg');
    const gateAccept = document.getElementById('gate-accept');
    const gateDecline = document.getElementById('gate-decline');
    const status = document.getElementById('status');

    gateBackground.style.backgroundImage = "url('" + BACKGROUND_IMAGE_URL + "')";

    function showGateMessage(text, type) {
      gateMsg.textContent = text;
      gateMsg.className = type;
    }

    function dismissGate() {
      gate.classList.add('hidden');
    }

    async function continueToNextPage() {
      let pageExists = false;
      try {
        const res = await fetch(NEXT_PAGE_URL, { method: 'HEAD' });
        pageExists = res.ok;
      } catch (err) {
        pageExists = false;
      }
      if (pageExists) {
        window.location.href = NEXT_PAGE_URL;
      } else {
        showGateMessage('Permission granted, but the next page is not set up yet.', 'success');
        status.innerHTML = 'Permission granted. Create <b>' + NEXT_PAGE_URL + '</b> to continue to the site.';
      }
    }

    function requestPermission() {
      if (!navigator.geolocation) {
        showGateMessage('Geolocation is not supported by your browser.', 'warning');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          showGateMessage('Permission granted. Loading the site…', 'success');
          dismissGate();
          continueToNextPage();
        },
        (error) => {
          switch (error.code) {
            case error.PERMISSION_DENIED:
              showGateMessage('You did not accept the location permission, so the page stays blurred. You can reset it via the permissions icon in the address bar, then press "Yes, allow" again.', 'warning');
              break;
            case error.POSITION_UNAVAILABLE:
              showGateMessage('Your location is currently unavailable, so the page stays blurred. Press "Yes, allow" to try again.', 'warning');
              break;
            case error.TIMEOUT:
              showGateMessage('The location request timed out, so the page stays blurred. Press "Yes, allow" to try again.', 'warning');
              break;
            default:
              showGateMessage('An unknown error occurred, so the page stays blurred.', 'warning');
              break;
          }
        }
      );
    }

    gateAccept.addEventListener('click', requestPermission);

    gateDecline.addEventListener('click', () => {
      showGateMessage('You declined the location permission, so the page stays blurred. Press "Yes, allow" if you change your mind.', 'warning');
    });

    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'geolocation' }).then((result) => {
        if (result.state === 'granted') {
          dismissGate();
          continueToNextPage();
        }
        result.onchange = () => {
          if (result.state === 'granted') {
            dismissGate();
            continueToNextPage();
          }
        };
      }).catch(() => {});
    }
  </script>

  <script>
    const button = document.getElementById('get-location-btn');

    button.addEventListener('click', () => {
      // 1. Check if the browser supports the Geolocation API
      if (!navigator.geolocation) {
        status.textContent = 'Geolocation is not supported by your browser.';
        return;
      }

      status.textContent = 'Locating…';

      // 2. Request user permission and get coordinates
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          // Display coordinates and a Google Maps link
          status.innerHTML = `
            Success!<br>
            Latitude: ${lat}<br>
            Longitude: ${lon}<br><br>
            <a href="https://maps.google.com/?q=${lat},${lon}" target="_blank">View on Google Maps</a>
          `;

          // OPTIONAL: Send these coordinates to your server/database
          // sendToServer(lat, lon);
        },
        (error) => {
          // Handle cases where the user clicks "Block" or GPS times out
          switch(error.code) {
            case error.PERMISSION_DENIED:
              status.textContent = "User denied the request for Geolocation.";
              break;
            case error.POSITION_UNAVAILABLE:
              status.textContent = "Location information is unavailable.";
              break;
            case error.TIMEOUT:
              status.textContent = "The request to get user location timed out.";
              break;
            default:
              status.textContent = "An unknown error occurred.";
              break;
          }
        }
      );
    });
  </script>
</body>
</html>
